<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Application</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: auto;
      padding: 20px;
      background: #f5f5f5;
    }

    .form-box {
      background: white;
      padding: 25px;
      border-radius: 10px;
    }

    h1 {
      text-align: center;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 25px;
      border: none;
      border-radius: 5px;
      background: #1976d2;
      color: white;
      font-size: 16px;
    }

    #message {
      text-align: center;
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="form-box">

  <h1>Online Application</h1>

  <form id="applicationForm">

    <label>Full Name</label>
    <input type="text" id="fullName" required>

    <label>Email</label>
    <input type="email" id="email" required>

    <label>Phone Number</label>
    <input type="tel" id="phone" required>

    <button type="submit">Submit Application</button>

  </form>

  <p id="message"></p>

</div>

<script>

const scriptURL = "https://script.google.com/macros/s/AKfycbyoXd1gO4kHGbKDRxNYEhL1qyZ_v6h9Kky_Tf-_RGo99i56G2PuyYg_bMKrx0m7LBxGsg/exec";

document.getElementById("applicationForm").addEventListener("submit", async function(e) {

  e.preventDefault();

  const message = document.getElementById("message");

  const data = {
    fullName: document.getElementById("fullName").value,
    email: document.getElementById("email").value,
    phone: document.getElementById("phone").value
  };

  message.textContent = "Submitting...";

  try {

    const response = await fetch(scriptURL, {
      method: "POST",
      body: JSON.stringify(data)
    });

    const result = await response.json();

    if (result.success) {

      message.textContent = "Application submitted successfully!";

      document.getElementById("applicationForm").reset();

    } else {

      message.textContent = "Something went wrong.";

    }

  } catch (error) {

    message.textContent = "Error submitting application.";

  }

});

</script>

</body>
      </html>
